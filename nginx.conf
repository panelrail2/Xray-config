server {

listen 443 ssl http2;

server_name _;


ssl_certificate /etc/xray/cert/fullchain.pem;

ssl_certificate_key /etc/xray/cert/private.key;



location /xhttp {

proxy_pass http://127.0.0.1:8443;

proxy_http_version 1.1;

proxy_set_header Host $host;

proxy_set_header X-Real-IP $remote_addr;

}



location / {

root /var/www/html;

index index.html;

}
